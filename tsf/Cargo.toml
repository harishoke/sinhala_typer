[package]
name = "sinhala_typer_tsf"
version = "1.3.0"
edition = "2021"
description = "TSF text service that registers Sinhala Typer as two Windows keyboards (Unicode / FM Abhaya) under the Sinhala language."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
