[package]
name = "sinhala_typer_tsf"
version = "3.0.0"
edition = "2021"
description = "TSF text service (IME) that provides Sinhala Typer as two Windows keyboards (Unicode / FM Abhaya) under the Sinhala language."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
sinhala_engine = { path = "../engine" }
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
# An IME lives inside other applications: a panic must never abort the
# host process. Every entry point also catches panics (see `guard`).
panic = "unwind"
