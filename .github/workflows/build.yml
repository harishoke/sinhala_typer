name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run engine unit tests
        run: cargo test

  windows:
    name: Windows build + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build optimized release binary
        run: cargo build --release
      - name: Show binary size
        run: (Get-Item target\release\sinhala_typer.exe).Length
      - name: Smoke test (process stays alive with hook + tray)
        shell: pwsh
        run: |
          $psi = new-object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "target\release\sinhala_typer.exe"
          $psi.WorkingDirectory = (Get-Location)
          $psi.RedirectStandardError = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 8
          if (-not $p.HasExited) {
            Write-Host "smoke ok: sinhala_typer.exe is running"
            Stop-Process -Id $p.Id -Force
          } else {
            Write-Host "sinhala_typer.exe exited prematurely with code $($p.ExitCode):"
            $p.StandardError.ReadToEnd() | Write-Host
            exit 1
          }
      - name: Extract version
        id: ver
        shell: bash
        run: |
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer\sinhala_typer.iss
      - name: Upload portable binary
        uses: actions/upload-artifact@v4
        with:
          name: sinhala_typer-${{ steps.ver.outputs.version }}-windows-x64
          path: target/release/sinhala_typer.exe
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sinhala_typer-setup-${{ steps.ver.outputs.version }}
          path: dist/sinhala_typer-setup-${{ steps.ver.outputs.version }}.exe

  release:
    name: GitHub Release
    needs: [test, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/sinhala_typer-*.exe
